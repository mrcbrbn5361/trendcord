name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: python -m compileall -q -x "(venv|node_modules|__pycache__|\.git)" .

  web-smoke:
    name: Web Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gercek web katmanini (web.app) ayaga kaldirip rota/CSRF/guvenlik
      # basliklarini dogrular. COOKIE_SECURE=0 zorunlu (duz HTTP testi).
      - name: Run smoke tests
        env:
          COOKIE_SECURE: "0"
        run: python tests/test_web_smoke.py