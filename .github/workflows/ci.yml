name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Ruff
        run: pip install ruff
      
      - name: Run Ruff
        run: ruff check .
      
      - name: Run Ruff Format
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install mypy
        run: pip install mypy
      
      - name: Run mypy
        run: mypy .

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trendcord_test
          POSTGRES_USER: trendcord
          POSTGRES_PASSWORD: trendcord
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements/dev.txt
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://trendcord:trendcord@localhost:5432/trendcord_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          pytest --cov=app --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/api/coverage.xml

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install pnpm
        run: corepack enable
      
      - name: Install dependencies
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
      
      - name: Run lint
        run: |
          cd apps/web
          pnpm lint
      
      - name: Run type check
        run: |
          cd apps/web
          pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API
        run: |
          docker build -f docker/Dockerfile.api -t trendcord-api .
      
      - name: Build Bot
        run: |
          docker build -f docker/Dockerfile.bot -t trendcord-bot .
      
      - name: Build Web
        run: |
          docker build -f docker/Dockerfile.web -t trendcord-web .
