name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: python -m compileall -q -x "(venv|node_modules|__pycache__|\.git)" .

  web-smoke:
    name: Web Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gercek web katmanini (web.app) ayaga kaldirip rota/CSRF/guvenlik
      # basliklarini dogrular. COOKIE_SECURE=0 zorunlu (duz HTTP testi).
      - name: Run smoke tests
        env:
          COOKIE_SECURE: "0"
        run: python tests/test_web_smoke.py

  cog-guards:
    name: Discord API Kullanim Kontrolleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # test_provisioner.py provisioner.official.runner'i import ediyor ve o
      # modul discord.py'ye bagli. Tam requirements.txt kurmaya gerek yok
      # (curl_cffi/cloudscraper bu testlerde kullanilmiyor) ama discord.py sart.
      - name: Install test dependencies
        run: pip install --disable-pip-version-check "discord.py==2.7.1"

      # discord.py 2.7 API kullanimlari: Context.followup / defer(thinking) /
      # tree.on_error. Bunlar calisma aninda patliyor, CI'da yakalansin.
      - name: Run cog guard tests
        run: python tests/test_cog_guards.py

      # Provisioner reset/temizleme yollari (saf testler, API gerektirmez).
      - name: Run provisioner tests
        run: python tests/test_provisioner.py

  security:
    name: Guvenlik Regresyon Testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Path traversal, origin erisimi, rate-limit fail-open, XFF, OAuth
      # state, session fixation, API kapsam sizintisi.
      - name: Run security tests
        run: python tests/test_security.py