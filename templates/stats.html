{% extends "layout.html" %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-sm">
    <h1 class="text-3xl font-bold mb-10 text-trendyol text-center">Sistem İstatistikleri</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="text-center p-8 bg-gray-50 rounded-xl">
            <div class="text-4xl font-black text-trendyol mb-2">{{ stats.total_users }}</div>
            <div class="text-gray-500 uppercase tracking-wider text-sm font-bold">Toplam Kullanıcı</div>
        </div>
        <div class="text-center p-8 bg-gray-50 rounded-xl">
            <div class="text-4xl font-black text-trendyol mb-2">{{ stats.total_products }}</div>
            <div class="text-gray-500 uppercase tracking-wider text-sm font-bold">Takip Edilen Ürün</div>
        </div>
        <div class="text-center p-8 bg-gray-50 rounded-xl">
            <div class="text-4xl font-black text-trendyol mb-2">{{ stats.total_subscriptions }}</div>
            <div class="text-gray-500 uppercase tracking-wider text-sm font-bold">Aktif Abonelik</div>
        </div>
    </div>

    <div class="mt-16 text-center text-gray-400 text-sm italic">
        * İstatistikler gerçek zamanlı olarak veritabanımızdan çekilmektedir.
    </div>
</div>
{% endblock %}
